{% extends 'base.html' %}
{% block title %}
{{ student.first_name }} {{ student.last_name }}
{% endblock title %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3 col-8 offset-2">
        <div class="card">
            <div class="card-header text-center "><h3>Guruhga qo'shish</h3></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group my-2">
                        <label for="first_name" class="form-label">Username</label>
                        <input readonly id="first_name" placeholder="{{ student.username }}" class="form-control" type="text">
                    </div>
                    <div class="form-group my-2">
                        <label for="first_name" class="form-label">Ism</label>
                        <input readonly id="first_name" placeholder="{{ student.first_name }}" class="form-control" type="text">
                    </div>
                    <div class="form-group my-2">
                        <label for="first_name" class="form-label">Familiya</label>
                        <input readonly id="first_name" placeholder="{{ student.last_name }}" class="form-control" type="text">
                    </div>
                    <div class="form-group my-2">
                        <label for="group" class="form-label">Guruh</label>
                        <select required  name="group" id="group" class="form-select" >
                                {% for group in groups %}
                                    <option name="group" value="{{ group.id }}">{{ group.name }}</option>
                                {% endfor %}
                        </select>
                    </div>
                    <div class="form-group my-2">
                        <label for="date" class="form-label">Kelgan sana</label>
                        <input required id="date" name="date"  placeholder="{{ student.first_name }}" class="form-control" type="date">
                    </div>
                    <div class="w-100 text-end">
                        <button class="btn btn-primary" >Yuborish</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
{% endblock content %}
