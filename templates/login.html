{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login{% endblock title %}

{% block content %}
<div class="container" >
    <div class="row mt-4 " >
        <div class="col-6 offset-3" >
            <div class="card" >
                <div class="card-header" ><h1>Login</h1></div>
                <div class="card-body" >
                    <form method="post">
                        {% csrf_token %}
                        {{ form | crispy }}
                        <button class="btn btn-outline-primary" type="submit" >Yuborish</button>
                    </form>
                </div>

            </div>


</div>
    </div>

</div>

{% endblock content %}
