{% extends 'base.html' %}
{% block title %}Payment{% endblock title %}
{% block content %}
<div class="row mt-4" >
    <div class="col-6 offset-3" >
        <div class="card" >
            <div class="card-header" >
                <h4>{{ student.first_name }} {{ student.last_name }}</h4>
            </div>
            <div class="card-body" >
                <form method="post" >
                    {% csrf_token %}
                    <div class="form-group pt-2 mt-2" >
                        <label for="sale">Chegirma</label>
                        {% if sale %}
                        <input type="checkbox" checked value="on"  class="form-check-input" id="sale" name="sale">
                        {% else %}
                        <input type="checkbox" value="on" class="form-check-input" id="sale" name="sale">
                        {% endif %}

                    </div>
                    <div class=" mt-2 form-group pt-2" >
                        <label for="is_sale">Faqat marzak tomonidan</label>
                        {% if is_sale %}
                        <input checked value="on" type="checkbox" class="form-check-input" id="is_sale" name="is_sale" >
                        {% else %}
                        <input type="checkbox" class="form-check-input" id="is_sale" name="is_sale" >
                        {% endif %}
                    </div>
                    <div class="form-group mt-2 pt-2 " >
                        <label for="count">To'lov miqdori</label>
                        <input type="number" class="form-control" id="count" name="count" required>
                        <small>{{ count }}</small>
                    </div>

                    <button type="submit" class="btn btn-warning mt-4 " >Yuborish</button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock content %}
