{% extends 'base.html' %}
{% block title %}
Profil
{% endblock title %}

{% block content %}
<div class="row mt-4">

    <div class="col-md-6 offset-md-3 col-8 offset-2 p-2">
        <div class="card">
            <div class="card-header">{{ user.first_name }} {{ user.last_name }}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group mt-3">
                        <label for="username" class="form-label">Username</label>
                        <input  id="username" placeholder="{{ user.username }}" value="{{user.username}}" name="username"  required class="form-control" type="text">
                    </div>
                    <div class="form-group mt-3">
                        <label for="first_name" class="form-label">Ism</label>
                        <input id="first_name" placeholder="{{ user.first_name }}" value="{{user.first_name}}"  name="first_name"  required class="form-control" type="text">
                    </div>
                    <div class="form-group mt-3">
                        <label for="last_name" class="form-label">Familiya</label>
                        <input id="last_name" placeholder="{{ user.last_name }}" value="{{user.last_name}}" name="last_name"  required class="form-control" type="text">
                    </div>
                    <div class="form-group mt-3">
                        <label for="phone_number" class="form-label">Telefon raqam</label>
                        <input  id="phone_number" placeholder="{{ user.phone_number }}" value="{{user.phone_number}}" name="phone_number"  required class="form-control" type="text">
                    </div>
                    <div class="form-group mt-3">
                        <label for="phone_number2" class="form-label">Qo'shimcha telefon raqam</label>
                        <input  id="phone_number2" placeholder="{{ user.phone_number2 }}" value="{{user.phone_number2}}" name="phone_number2"  required class="form-control" type="text">
                    </div>

                    <div  class="w-100 d-flex justify-content-between mt-4 ">

                        <button type="submit" class="btn btn-primary " >O'zgartirish</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
